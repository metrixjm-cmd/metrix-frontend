<div class="min-h-screen bg-[#0b1220] text-white">
  <header class="border-b border-white/10">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center gap-3">
      <a routerLink="/productos" class="text-white/50 hover:text-white text-sm">← Catálogo</a>
      <h1 class="text-lg font-bold">Resultado del pago</h1>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
    @if (loading()) {
      <div class="h-24 rounded-xl bg-white/5 animate-pulse"></div>
    }

    <div class="rounded-xl border border-white/10 p-5 bg-white/[0.03] space-y-3">
      <p class="text-sm text-white/70">{{ message() }}</p>
      @if (order(); as o) {
        <p class="text-xs text-white/40">Orden {{ o.id }} · estado {{ o.status }} · cobro {{ o.paymentStatus || 'NONE' }}</p>
      }
      @if (error()) {
        <p class="text-sm text-red-300">{{ error() }}</p>
        <button type="button" (click)="retryPay()"
                class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-sm font-medium">
          Reintentar pago
        </button>
      }
    </div>
  </main>
</div>
