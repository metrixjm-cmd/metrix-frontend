<div class="min-h-screen flex items-center justify-center p-6 sm:p-10 bg-white/[0.04]">
  <div class="w-full max-w-md">
    <div class="mb-8">
      <h2 class="text-2xl font-bold text-white mb-1">Nueva contraseña</h2>
      @if (empresaNombre()) {
        <p class="text-white/50 text-sm">{{ empresaNombre() }} · {{ numeroUsuario() }}</p>
      }
    </div>

    @if (loading()) {
      <div class="h-40 rounded-xl bg-white/5 animate-pulse"></div>
    } @else if (invalid()) {
      <div class="p-4 rounded-xl bg-amber-500/15 border border-amber-500/25 text-amber-200 text-sm">
        Esta liga no es válida o ya fue usada. Pide un nuevo cambio de contraseña.
      </div>
      <a routerLink="/auth/forgot-password"
         class="mt-6 inline-flex text-cyan-300 hover:text-cyan-200 text-sm font-medium">
        Solicitar de nuevo
      </a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-5">
        <div>
          <label for="newPassword" class="block text-sm font-medium text-white/70 mb-1.5">Nueva contraseña</label>
          <div class="relative">
            <input
              id="newPassword"
              formControlName="newPassword"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="••••••••"
              class="input-field pr-11"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-white/40 hover:text-white/60 transition-colors"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (showPassword()) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21" />
                </svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              }
            </button>
          </div>
        </div>
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-white/70 mb-1.5">Confirmar</label>
          <div class="relative">
            <input
              id="confirmPassword"
              formControlName="confirmPassword"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="new-password"
              placeholder="••••••••"
              class="input-field pr-11"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-white/40 hover:text-white/60 transition-colors"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (showPassword()) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21" />
                </svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              }
            </button>
          </div>
        </div>

        @if (errorMessage()) {
          <div class="p-3.5 bg-amber-500/15 border border-amber-500/25 rounded-xl text-sm text-amber-400" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <button
          type="submit"
          [disabled]="saving() || form.invalid"
          class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 disabled:bg-white/[0.05] disabled:text-white/40
                 disabled:cursor-not-allowed text-white font-semibold rounded-lg"
        >
          {{ saving() ? 'Guardando...' : 'Guardar contraseña' }}
        </button>
      </form>
    }
  </div>
</div>
